[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomed-lakehouse"
version = "0.1.0"
description = "Hệ thống Quản trị Dữ liệu Y Sinh & Mô hình hóa Thống kê Dự báo Nguy cơ Biến cố Lâm sàng (IT5425)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Biomedicine Research Group - IT5425", email = "group-biomed@soict.hust.edu.vn" }
]
dependencies = [
    # Core Data Lakehouse & Ingestion (TV 1)
    "deltalake>=0.17.0",
    "lancedb>=0.6.0",
    "pylance>=0.10.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",

    # Data Governance & Privacy (TV 2)
    "great-expectations>=0.18.0",
    "pycanon>=1.0.0",

    # Biomedical EDA & Hypothesis Testing (TV 3)
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",

    # Statistical Modelling (TV 4)
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "pygam>=0.9.0",

    # Visualization & CDSS Dashboard (TV 5 & TV 6)
    "plotly>=5.18.0",
    "dash>=2.16.0",
    "dash-bootstrap-components>=1.5.0",
    "flask-caching>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
